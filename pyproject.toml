# -----------------------------------------------------------------------------
# Purpose
#   Define the Python project metadata and its future development dependencies.
# Why this file exists
#   Python tooling needs one predictable place to learn the project name, Python
#   version, dependencies, test configuration, and eventual CLI command.
# Responsibility
#   Keep project-wide configuration only. It must not contain application logic,
#   secrets, prompts, or MCP server settings.
# Implement later
#   Add the minimum dependencies when each is needed: Pydantic for models,
#   httpx for GitHub HTTP calls, the MCP SDK, Agno, and python-dotenv.
#   Later add a `compass` command that calls `compass.cli:main`.
# Interacts with
#   Every Python file indirectly through your virtual environment and test tools.
# Inputs and outputs
#   Inputs are package/version choices; outputs are an installable environment and
#   repeatable development commands.
# Concepts to practice
#   Python packaging, virtual environments, dependency management, and CLI entry
#   points. Keep dependencies empty until you can explain why each one is needed.
# -----------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-compass"
version = "0.1.0"
description = "A beginner-focused open-source contribution guide."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx",
    "agno",
    "groq",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["."]

