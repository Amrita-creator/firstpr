# -----------------------------------------------------------------------------
# Purpose
#   Define the Python project metadata and development dependencies.
# -----------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-compass"
version = "0.1.0"
description = "A beginner-focused open-source contribution guide."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "google-antigravity>=0.1.0",
    "openai>=1.40.0",
]

[project.scripts]
firstpr = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["main", "config", "models", "utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "github*", "recommender*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
